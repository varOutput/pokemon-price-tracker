name: Fetch Pokémon prices

on:
  schedule:
    # 21:23 UTC daily. TCGCSV rebuilds once a day around 20:05 UTC, so this
    # leaves margin. Off-the-hour on purpose (GitHub's scheduler gets
    # congested at :00). If it runs before the rebuild, the script sees the
    # build is already saved and makes no further requests.
    - cron: "23 21 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the job can commit data/ back to the repo

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 7z fills missed days from TCGCSV's price archive; usually preinstalled.
          command -v 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)

      - name: Run price fetch
        run: python scripts/fetch_prices.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Price snapshot: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            echo "Push failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
